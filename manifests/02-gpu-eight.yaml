# 02-gpu-eight.yaml — NVIDIA Cluster Readiness #1, #3, #8
# Mục tiêu: xác minh đội thực sự được dedicate 8× H200 trên 1 HGX node.
# Goal: confirm the team is dedicated 8× H200 on a single HGX node.
#
# This pod requests nvidia.com/gpu: 8 — it should schedule iff the team
# truly owns the node and no other workload (e.g. the running NIM) is
# holding a GPU. If the NIM pod is up, scale it to 0 first, or expect a
# 7-GPU pending state and re-run.
apiVersion: v1
kind: Pod
metadata:
  name: chk-02-gpu-eight
  labels:
    app.kubernetes.io/part-of: servers-checklist
    chk: "02-gpu-eight"
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ${TEAM_NODE}
  securityContext:
    runAsUser: 1006
    runAsGroup: 1010
    runAsNonRoot: true
    fsGroup: 1010
    supplementalGroups: [1009, 1010]
  containers:
  - name: smi8
    image: nvidia/cuda:12.4.0-base-ubuntu22.04
    imagePullPolicy: IfNotPresent
    command: ["bash", "-lc"]
    args:
    - |
      set -e
      echo "=== nvidia-smi -L ==="
      nvidia-smi -L
      COUNT=$(nvidia-smi -L | wc -l)
      echo "GPU_COUNT=${COUNT}"
      [ "${COUNT}" -eq 8 ] && echo "CHECK_PASS: 8 GPU dedicated"
    resources:
      requests: { nvidia.com/gpu: "8" }
      limits:   { nvidia.com/gpu: "8" }
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
