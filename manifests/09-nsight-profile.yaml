# 09-nsight-profile.yaml — NVIDIA Cluster Readiness #13
# Mục tiêu: chạy `nsys profile` để xác nhận Nsight Systems hoạt động.
# Goal: run a tiny PyTorch matmul under nsys to confirm Nsight is present.
#
# nsys is shipped inside the NGC PyTorch image at /usr/local/cuda/bin/nsys
# (and on PATH). The profile is written to /tmp inside the container — we
# don't require persistent storage for this check.
apiVersion: batch/v1
kind: Job
metadata:
  name: chk-09-nsight
  labels:
    app.kubernetes.io/part-of: servers-checklist
    chk: "09-nsight"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { chk: "09-nsight" }
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ${TEAM_NODE}
      imagePullSecrets:
      - name: ngc-registry
      securityContext:
        runAsUser: 1006
        runAsGroup: 1010
        runAsNonRoot: true
        fsGroup: 1010
        supplementalGroups: [1009, 1010]
      containers:
      - name: nsys
        image: nvcr.io/nvidia/pytorch:24.10-py3
        imagePullPolicy: IfNotPresent
        command: ["bash", "-lc"]
        args:
        - |
          set -e
          command -v nsys >/dev/null || { echo "nsys not on PATH"; exit 2; }
          nsys --version
          OUT=/tmp/nsys-out.nsys-rep
          nsys profile --force-overwrite=true -o /tmp/nsys-out -t cuda,nvtx \
            python -c "
          import torch
          a = torch.randn(4096, 4096, device='cuda')
          b = torch.randn(4096, 4096, device='cuda')
          for _ in range(50):
              c = a @ b
          torch.cuda.synchronize()
          print('matmul ok', c.shape)
          "
          [ -s "$OUT" ] && echo "CHECK_PASS: nsys report $(stat -c%s "$OUT") bytes" \
            || { echo "CHECK_FAIL: nsys report empty"; exit 1; }
        resources:
          requests: { nvidia.com/gpu: "1" }
          limits:   { nvidia.com/gpu: "1" }
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
